name: Publish locked Mission Meals site

on:
  push:
    branches:
      - migration/locked-site-upload
    paths:
      - .github/workflows/publish-locked-site.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/locked-site-upload
          fetch-depth: 0

      - name: Reconstruct and publish exact site
        shell: bash
        run: |
          set -euo pipefail
          cat .migration/parts/part-* > /tmp/mission-meals-site.tar.gz.b64
          base64 --decode /tmp/mission-meals-site.tar.gz.b64 > /tmp/mission-meals-site.tar.gz
          echo "249dd42f093e4a3a4587b5ab3bcb731daac0b1110482d6575acea754fda8b1e2  /tmp/mission-meals-site.tar.gz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          tar -xzf /tmp/mission-meals-site.tar.gz -C .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish locked Mission Meals site"
          git push origin HEAD:main
